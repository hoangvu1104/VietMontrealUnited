name: Deploy to GoDaddy via SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godaddy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.GODADDY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z '*.php')
      - name: Validate deployment file list
        shell: pwsh
        run: ./tools/deploy-sftp.ps1 -DryRun
      - name: Prepare SSH credentials
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$HOST_KEYS"
          umask 077
          mkdir -p "$RUNNER_TEMP/godaddy-ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$RUNNER_TEMP/godaddy-ssh/id_deploy"
          printf '%s\n' "$HOST_KEYS" | tr -d '\r' > "$RUNNER_TEMP/godaddy-ssh/known_hosts"
          if ! ssh-keygen -y -P '' -f "$RUNNER_TEMP/godaddy-ssh/id_deploy" > /dev/null 2>&1; then
            echo '::error::SFTP_PRIVATE_KEY must contain the complete, unencrypted private key, including BEGIN/END lines and real newlines. Use the private key, not its .pub file.'
            exit 1
          fi
      - name: Upload application files
        shell: pwsh
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PUBLIC_ROOT: ${{ secrets.SFTP_PUBLIC_ROOT }}
        run: |
          ./tools/deploy-sftp.ps1 -IdentityFile "$env:RUNNER_TEMP/godaddy-ssh/id_deploy" -KnownHostsFile "$env:RUNNER_TEMP/godaddy-ssh/known_hosts"
      - name: Remove SSH credentials
        if: always()
        shell: pwsh
        run: |
          $credentialDirectory = Join-Path $env:RUNNER_TEMP 'godaddy-ssh'
          if (Test-Path -LiteralPath $credentialDirectory) {
            Remove-Item -LiteralPath $credentialDirectory -Recurse -Force
          }


